name: example
description: nimble_charts Demo
homepage: https://github.com/Nimblesite/nimble_charts
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0 <4.0.0'

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_staggered_animations: ^1.1.1
  flutter_test:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.18.0
  nimble_charts:
    path: ../
  nimble_charts_common:
    git:
      url: https://github.com/meikethomas/nimble_charts.git
      ref: upgrade/flutter-3.44.9
      path: charts_common
flutter:
  uses-material-design: true
dev_dependencies:
  austerity: ^1.3.0

dependency_overrides:
  nimble_charts_common:
    path: ../../charts_common
