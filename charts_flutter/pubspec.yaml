name: nimble_charts
version: 0.5.0-beta
description: Charts for Flutter. A fork of charts_flutter
homepage: https://github.com/Nimblesite/nimble_charts
publish_to: "none"

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0 <4.0.0"

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  meta: ^1.18.0

  nimble_charts_common:
    git:
      url: https://github.com/meikethomas/nimble_charts.git
      ref: upgrade/flutter-3.44.9
      path: charts_common

dev_dependencies:
  austerity: ^1.3.0
  build_runner: ^2.15.1
  example:
    path: example
  flutter_staggered_animations: ^1.1.1
  flutter_test:
    sdk: flutter
  mockito: ^5.6.4
  test: ^1.31.0
